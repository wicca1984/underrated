# cargo-deny: 依存の脆弱性監査・ライセンス互換・依存ポリシー(AGENTS I-1)を機械強制する。
# 依存ゼロの今は素通りするが、依存が増えた瞬間からゲートとして効く。

[advisories]
version = 2
# RustSec 脆弱性 DB。yanked クレートは既定で deny。
ignore = [
  # paste: proc-macro, unmaintained だが脆弱性ではない。boa_engine の推移依存。
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# product は Apache-2.0。許可する OSS ライセンスを明示し、未知ライセンスは弾く。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots (Mozilla CA bundle, via rustls/ureq TLS): permissive data license.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"   # 重複バージョンは警告
wildcards = "deny"           # workspace 内の "*" 依存は禁止
# deny = [...]               # 将来 I-1 で「ブラウザ中核を肩代わりする巨大クレート」を列挙して禁止

[sources]
unknown-registry = "deny"
unknown-git = "deny"
