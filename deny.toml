# cargo-deny: machine-enforces dependency vulnerability auditing, license compatibility,
# and dependency policy (AGENTS I-1). With zero deps today it passes through, but it acts
# as a gate the moment dependencies are added.

[advisories]
version = 2
# RustSec vulnerability DB. Yanked crates are denied by default.
ignore = [
  # paste: a proc-macro, unmaintained but not a vulnerability; transitive via boa_engine.
  # Remove once boa drops paste (revisit periodically).
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (no security impact); transitive via boa_engine. Remove once boa drops it." },
]

[licenses]
version = 2
# The product is Apache-2.0. List the allowed OSS licenses explicitly and reject unknown ones.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots (Mozilla CA bundle, via rustls/ureq TLS): permissive data license.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"   # warn on duplicate versions
wildcards = "deny"           # forbid "*" deps within the workspace
# deny = [...]               # future I-1: list/forbid huge crates that would replace the browser core

[sources]
unknown-registry = "deny"
unknown-git = "deny"
