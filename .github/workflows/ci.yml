name: CI

# Run the deterministic gates on worker branch pushes and PRs.
# AI review (OCR) runs on the local orchestration side (the local LLM is unreachable from cloud runners).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install CJK fonts (for shipping-path glyph rendering)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic fonts-wqy-zenhei

      # ubuntu-latest ships rustup, so avoid the flaky `curl sh.rustup.rs` install and
      # only wrap the component fetch in a retry (up to 3 attempts to ride out
      # transient GitHub/rustup network failures).
      - name: Install Rust toolchain (stable, edition 2024) — resilient
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update && rustup default stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Doc (deny warnings)
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  windows:
    name: windows build + test (stack-overflow regression guard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain — resilient
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          # windows-latest's default shell is Windows PowerShell 5.1, where '&&' is not a
          # valid statement separator; force bash (shipped with the runner) so the same
          # command syntax as the ubuntu job works.
          shell: bash
          command: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

  deny:
    name: cargo-deny (security / license / deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain — resilient
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update && rustup default stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Coverage summary
        run: cargo llvm-cov --all-targets --summary-only

  smoke:
    name: render smoke gate (hard thresholds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install CJK fonts (for shipping-path glyph rendering)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic fonts-wqy-zenhei

      # ubuntu-latest ships rustup, so avoid the flaky `curl sh.rustup.rs` install and
      # only wrap the component fetch in a retry (up to 3 attempts to ride out
      # transient GitHub/rustup network failures).
      - name: Install Rust toolchain (stable, edition 2024) — resilient
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update && rustup default stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run render smoke gate
        run: bash tools/smoke.sh
