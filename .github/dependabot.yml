version: 2
updates:
  # Rust crate dependencies (Cargo.toml / Cargo.lock). cargo-deny gates the new
  # versions for advisories + license compatibility; CI runs the full check suite.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions versions used in workflows (keeps checkout / rust-cache /
  # cargo-deny-action / install-action current; would have caught the Node 20 EOL).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
