[package]
name = "underrated"
version = "0.1.0"
edition = "2024"
description = "An independent web browser engine written from scratch in Rust."
license = "Apache-2.0"

[dependencies]
ab_glyph = "0.2.32"
boa_engine = "0.21.1"
boa_gc = "0.21.1"
fontdb = "0.23.0"
# font discovery + glyph rasterization for non-ASCII (CJK) fallback; leaf concern, not core (I-1)
jpeg-decoder = { version = "0.3.2", default-features = false }
gif = "0.13"
png = "0.18.1"
image-webp = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
softbuffer = "0.4"
ureq = { version = "3.3.0", features = ["gzip"] }
winit = "0.30"

# For loading test data (html5lib tokenizer JSON) only; the main code does not depend on these.
[dev-dependencies]

# Lints machine-enforce AGENTS.md I-1/I-6.
# unsafe fully forbidden / unwrap & expect forbidden in main code (tests are exempted via clippy.toml).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
# A browser engine's build gets heavy as deps grow; keep dev-time optimization minimal.
opt-level = 0
