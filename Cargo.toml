[package]
name = "underrated"
version = "0.1.0"
edition = "2024"
description = "An independent web browser engine written from scratch in Rust."
license = "Apache-2.0"

[dependencies]
softbuffer = "0.4"
winit = "0.30"

# テストデータ(html5lib tokenizer JSON)読み込み専用。本体コードは依存しない。
[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lint で AGENTS.md I-1/I-6 を機械強制する。
# unsafe 全面禁止 / 本体コードの unwrap・expect 禁止（テストは clippy.toml で免除）。
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
# ブラウザエンジンは依存が増えるとビルドが重くなりがち。開発時の最適化は最小に
opt-level = 0
