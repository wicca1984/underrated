<!DOCTYPE html>
<html><head><style>
body { margin: 16px; }
p { width: 360px; }
.indent { text-indent: 48px; }
.none { text-indent: 0; }
</style></head>
<body>
<p class="none">NO INDENT: The quick brown fox jumps over the lazy dog and keeps running across the field.</p>
<p class="indent">WITH INDENT: The quick brown fox jumps over the lazy dog and keeps running across the field.</p>
</body></html>
