<!DOCTYPE html>
<html><head><style>
  body { font-size: 20px; padding: 20px; background: #fff; color: #000; }
  .box { border: 1px solid #888; padding: 8px; }
  sup, .sup { vertical-align: super; font-size: 14px; color: #c00; }
  sub, .sub { vertical-align: sub; font-size: 14px; color: #06c; }
  .mid { vertical-align: middle; font-size: 28px; color: #090; }
  .top { vertical-align: text-top; font-size: 14px; color: #909; }
  .bot { vertical-align: text-bottom; font-size: 14px; color: #c60; }
</style></head>
<body>
  <div class="box">
    Normal text X<span class="sup">super</span> and X<span class="sub">sub</span> baseline.
  </div>
  <div class="box">
    Big<span class="mid">MIDDLE</span>line with <span class="top">TopAligned</span> and <span class="bot">BottomAligned</span> fragments.
  </div>
  <div class="box">
    H<sub>2</sub>O and E=mc<sup>2</sup> chemistry/physics notation.
  </div>
</body></html>
