<!DOCTYPE html>
<html>
<body style="margin:0">
  <!-- spaced form: width 320 / (16/9) = 180px tall -->
  <div style="width:320px;aspect-ratio:16 / 9;background-color:#2255cc"></div>
  <div style="height:6px"></div>
  <!-- tight (unspaced) form: must also be 180px tall -->
  <div style="width:320px;aspect-ratio:16/9;background-color:#22aa55"></div>
</body>
</html>
