<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #ffffff; margin: 0; padding: 20px; }
  .empty-bg   { width: 0px;  height: 30px; background-color: rgb(255,0,0); }
  .empty-h    { width: 60px; height: 0px;  background-color: rgb(0,180,0); }
  .empty-both { width: 0;    height: 0;    background-color: rgb(0,0,255); border: 4px solid rgb(255,0,255); }
  .empty-node { background-color: rgb(255,128,0); border: 2px solid rgb(0,0,0); }
  .real       { width: 100px; height: 40px; background-color: rgb(0,128,255); margin-top: 10px; }
  span.bordered { border: 3px solid rgb(120,0,120); }
</style>
</head>
<body>
  <div class="empty-bg"></div>
  <div class="empty-h"></div>
  <div class="empty-both"></div>
  <div class="empty-node"></div>
  <span class="bordered"></span>
  <div class="real">real box</div>
</body>
</html>
