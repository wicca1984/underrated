<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Display None Layout</title>
  <style>
    body { margin: 0; padding: 0; }
    .hidden { display: none; }
    .visible { width: 200px; height: 100px; }
  </style>
</head>
<body>
  <div class="visible">Visible Div</div>
  <div class="hidden">Hidden Div</div>
</body>
</html>
