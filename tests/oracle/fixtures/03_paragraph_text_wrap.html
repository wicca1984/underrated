<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Paragraph Text Wrap</title>
  <style>
    body { margin: 0; padding: 0; }
    p { width: 100px; font-size: 16px; line-height: 20px; }
  </style>
</head>
<body>
  <p>This is a short paragraph designed to wrap onto multiple lines because the container is very narrow.</p>
</body>
</html>
